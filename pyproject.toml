[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pemds"
version = "1.5.0"
description = "Process Equipment Mechanical Design Suite — code-based mechanical design calculations"
readme = "docs/spec.md"
# Spec targets Python 3.12+; >=3.11 keeps the package installable in the dev environment.
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.5",
    "pint>=0.23",
    "ezdxf>=1.1",
    "reportlab>=4.0",
    "CoolProp>=6.4,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[project.scripts]
pemds = "pemds.cli:main"
pemds-gui = "pemds.gui.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pemds.data" = ["**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:pemds.*"]

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
# These dependencies ship no type stubs; typed usage is checked everywhere else.
module = ["reportlab.*", "CoolProp.*"]
ignore_missing_imports = true
